[workspace]
resolver = "2"
members = ["crates/radar-core", "crates/radar-ingest", "crates/radar-capture", "src-tauri"]
default-members = ["crates/radar-core", "crates/radar-ingest", "crates/radar-capture"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"

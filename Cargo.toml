[workspace]
resolver = "2"
members = [
    "crates/radar-core",
    "crates/radar-ingest",
    "crates/radar-capture",
    "crates/radar-vision",
    "src-tauri",
]
default-members = [
    "crates/radar-core",
    "crates/radar-ingest",
    "crates/radar-capture",
    "crates/radar-vision",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"

# Image tracking is unusable without optimisation; keep tests fast in debug.
[profile.dev.package.radar-vision]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

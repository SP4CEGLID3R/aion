name: Income Assistant

on:
  push:
    branches: [main, "claude/**"]
    tags: ["income-v*"]   # a tag like income-v1.0.0 publishes a public download (GitHub Release)
    paths: ["income-assistant/**", ".github/workflows/income-assistant.yml"]
  pull_request:
    paths: ["income-assistant/**", ".github/workflows/income-assistant.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: income-assistant

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - run: python -m pyflakes aion_income tests
      - run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen

  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write   # to attach the .exe to a release on income-v* tags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Tests on Windows
        run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen
      - run: pyinstaller --noconfirm Aion2IncomeAssistant.spec
      - uses: actions/upload-artifact@v4
        with:
          name: Aion2IncomeAssistant-windows
          path: income-assistant/dist/Aion2IncomeAssistant.exe
          if-no-files-found: error
      - name: Publish release (income-v* tags only)
        if: startsWith(github.ref, 'refs/tags/income-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Kinah Forge (Aion 2 Income Assistant) ${{ github.ref_name }}
          files: income-assistant/dist/Aion2IncomeAssistant.exe
          body: |
            **Download `Aion2IncomeAssistant.exe` below and double-click it.** Windows 10/11, nothing to install.

            Windows may show "Windows protected your PC" because the app isn't code-signed: click **More info → Run anyway**.

            First run: open **Settings**, enter your crafting levels, then press **Refresh** (the first refresh takes about 40 seconds).

            The app only reads the public aion2.exchange website. It never touches the game, its files or its memory.
            Details and the simulation results: https://github.com/${{ github.repository }}/tree/${{ github.sha }}/income-assistant

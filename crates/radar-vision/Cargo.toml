[package]
name = "radar-vision"
description = "Reads the AION 2 minimap from the screen: map movement (visual odometry) and camera direction"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustfft = "6"
log.workspace = true

[target.'cfg(windows)'.dependencies]
# Screen copy only (GDI): nothing that opens other processes, reads or
# writes their memory, or sends input or window messages.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
] }

[dev-dependencies]
png = "0.17"

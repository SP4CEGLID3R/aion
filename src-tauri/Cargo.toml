[package]
name = "aion2-radar"
description = "Transparent, always-on-top radar of confirmed, currently spawned cubes"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "aion2_radar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
radar-core = { path = "../crates/radar-core" }
radar-ingest = { path = "../crates/radar-ingest" }
radar-capture = { path = "../crates/radar-capture" }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
